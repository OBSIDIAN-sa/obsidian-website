# Cloudflare Pages config for the Obsidian Design site + bot API (functions/).
# Deploy with:  npx wrangler pages deploy
# (Dashboard drag-and-drop does not deploy the functions/ folder.)
name = "obsidian-bot-preview"
pages_build_output_dir = "."
compatibility_date = "2026-10-01"

[vars]
# First date a showroom visit can be booked (YYYY-MM-DD). Empty = from tomorrow.
BOOK_FROM = "2026-11-28"
# Workers AI model for free-text answers, and the daily cap on customer AI replies (protects the free allocation).
AI_MODEL = "@cf/zai-org/glm-4.7-flash"
AI_DAILY_CAP = "250"

[[d1_databases]]
binding = "DB"
database_name = "obsidian-bot-preview"
database_id = "a7af01fc-5497-42be-876d-9fc3c290ce7e"

[ai]
binding = "AI"

# Secret (set once, not stored here):  npx wrangler pages secret put SETUP_KEY
