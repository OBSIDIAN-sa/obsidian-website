<!doctype html>
<!-- Open Graph card source. Rendered to assets/img/og-image.jpg by tools/make-og.mjs.
     Uses the site's own fonts, palette, stone texture and logo so the preview matches the page. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Cormorant Garamond'; font-weight: 300; src: url(../../assets/fonts/cormorant-garamond-latin-300-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 300; src: url(../../assets/fonts/inter-latin-300-normal.woff2) format('woff2'); }
@font-face { font-family: 'Tajawal'; font-weight: 400; src: url(../../assets/fonts/tajawal-arabic-400-normal.woff2) format('woff2'); }
:root {
  --ink: #050504; --onyx: #0C0A09; --bone: #EDE6DA; --warm-grey: #9A938A; --bronze: #C9A063; --bronze-lt: #EBD3A4;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  position: relative; background: var(--ink); color: var(--bone);
  display: grid; place-items: center; -webkit-font-smoothing: antialiased;
}
/* Same stone grain as the site ground */
body::before {
  content: ''; position: absolute; inset: 0; opacity: 0.08;
  background: url(../../assets/img/texture-stone-1200.jpg) center / cover;
}
/* A single warm downlight behind the mark, like the hero's spot */
body::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 34% 48% at 50% 34%, color-mix(in srgb, var(--bronze) 11%, transparent), transparent 72%);
}
/* Gallery hairline frame */
.frame { position: absolute; inset: 26px; border: 1px solid color-mix(in srgb, var(--bronze) 28%, transparent); z-index: 1; }
.card { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
.logo { width: 150px; height: auto; display: block; }
.wordmark { display: inline-block; margin-top: 30px; font-family: 'Cormorant Garamond', serif; font-weight: 300; line-height: 0.86; }
.wordmark__top { display: block; font-size: 124px; letter-spacing: 0.01em; }
.wordmark__bottom {
  display: flex; justify-content: space-between; margin-top: 16px; padding: 0 0.15em 0 0.25em;
  font-family: 'Inter', sans-serif; font-weight: 300; font-size: 20px; color: var(--bronze);
}
.rule { width: 56px; height: 1px; background: var(--bronze); margin: 34px 0 22px; }
.tag-ar { font-family: 'Tajawal', sans-serif; font-weight: 400; font-size: 25px; line-height: 1.3; direction: rtl; color: var(--bone); }
.tag-en { margin-top: 10px; font-family: 'Inter', sans-serif; font-weight: 300; font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--warm-grey); }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="card">
    <img class="logo" src="../../assets/img/logo-320.png" width="320" height="326" alt="">
    <div class="wordmark">
      <span class="wordmark__top">OBSIDIAN</span>
      <span class="wordmark__bottom"><span>D</span><span>E</span><span>S</span><span>I</span><span>G</span><span>N</span></span>
    </div>
    <div class="rule"></div>
    <p class="tag-ar">مطابخ · خزائن · حلول داخلية</p>
    <p class="tag-en">Kitchens · Wardrobes · Interior Solutions</p>
  </div>
</body>
</html>
